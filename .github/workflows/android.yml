name: Build Family Assistant APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Family Assistant APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p project
          for z in *.zip; do
            if [ -f "$z" ]; then
              unzip -q -o "$z" -d project
            fi
          done

      - name: Find Gradle project
        id: loc
        run: |
          f=$(find project -name "settings.gradle*" | head -1)
          if [ -z "$f" ]; then
            f=$(find . -maxdepth 2 -name "settings.gradle*" | head -1)
          fi
          echo "settings file: $f"
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - name: Fix minSdk for adaptive icons
        run: |
          f=$(find project -name "build.gradle.kts" -path "*app*" | head -1)
          if [ -n "$f" ]; then
            echo "Editing: $f"
            sed -i -E 's/minSdk *= *[0-9]+/minSdk = 26/' "$f"
            grep -n "minSdk" "$f"
          fi

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build Debug APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log || {
            echo "========== ERRORS =========="
            grep -E "^e: |What went wrong|Could not|Unresolved|error:" -A3 build.log | head -60
            exit 1
          }

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyAssistant-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Family Assistant Android App
          files: "**/build/outputs/apk/debug/*.apk"
